<title>حلازون — إدارة المخزون</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Noto+Sans+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C8872A; --gold-d:#A06E1F; --gold-l:#FDF6EC;
  --navy:#1B2A45; --navy-l:#2A3F63;
  --bg:#F7F8FA; --card:#FFFFFF; --border:#E4E7EC;
  --text:#1B2A45; --text2:#667085; --text3:#98A2B3;
  --green:#12805C; --green-l:#ECFDF3;
  --red:#D92D20; --red-l:#FEF3F2;
  --amber:#B54708; --amber-l:#FFFAEB;
  --blue:#1849A9; --blue-l:#EFF8FF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding-bottom:40px}
body.bn{font-family:'Noto Sans Bengali','Cairo',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

#login{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy),var(--navy-l));display:flex;align-items:center;justify-content:center;padding:20px;z-index:999}
.lg-box{background:#fff;border-radius:20px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lg-logo{text-align:center;margin-bottom:22px}
.lg-logo img{height:44px}
.lg-title{text-align:center;font-size:19px;font-weight:800;color:var(--navy);margin-bottom:4px}
.lg-sub{text-align:center;font-size:12px;color:var(--text2);margin-bottom:22px}

.nav{background:var(--navy);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;gap:10px}
.nav-logo img{height:28px}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-user{text-align:start;line-height:1.25}
.nav-name{font-size:12.5px;font-weight:800}
.nav-role{font-size:10.5px;opacity:.72}
.lang-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:800;cursor:pointer}
.nav-tabs{display:flex;overflow-x:auto;gap:2px;padding:0 8px;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;color:rgba(255,255,255,.62);padding:11px 13px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.active{color:#fff;border-bottom-color:var(--gold)}

.wrap{max-width:980px;margin:0 auto;padding:14px}
.page-title{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--border);border-radius:13px;padding:13px 11px;text-align:center}
.stat-val{font-size:20px;font-weight:900;line-height:1.2}
.stat-lbl{font-size:10.5px;color:var(--text2);font-weight:700;margin-top:3px}

.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--text2);margin-bottom:5px}
.inp{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;background:#fff;color:var(--text);outline:none;font-weight:600}
.inp:focus{border-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{border:none;border-radius:10px;padding:11px 17px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--gold);color:#fff}
.btn-n{background:var(--navy);color:#fff}
.btn-g{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-r{background:var(--red);color:#fff}
.btn-ok{background:var(--green);color:#fff}
.btn-full{width:100%}
.btn-sm{padding:8px 13px;font-size:12px}

.row{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.row-img{width:46px;height:46px;border-radius:9px;object-fit:cover;flex-shrink:0;background:var(--gold-l)}
.row-ph{width:46px;height:46px;border-radius:9px;background:var(--gold-l);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.row-mid{flex:1;min-width:0}
.row-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-brand{font-size:11px;color:var(--gold-d);font-weight:700}
.qty-inp{width:74px;text-align:center;border:1.5px solid var(--border);border-radius:9px;padding:9px 4px;font-size:15px;font-weight:800;font-family:inherit;color:var(--text);outline:none}
.qty-inp:focus{border-color:var(--gold)}
.saved{border-color:var(--green)!important;background:var(--green-l)!important}

.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800}
.p-ok{background:var(--green-l);color:var(--green)}
.p-low{background:var(--amber-l);color:var(--amber)}
.p-out{background:var(--red-l);color:var(--red)}
.p-info{background:var(--blue-l);color:var(--blue)}

.log{border-inline-start:3px solid var(--border);padding:9px 12px;margin-bottom:8px;background:#fff;border-radius:0 10px 10px 0}
.log.in{border-inline-start-color:var(--green)}
.log.out{border-inline-start-color:var(--red)}
.log.set{border-inline-start-color:var(--gold)}
.log.count{border-inline-start-color:var(--blue)}
.log-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.log-name{font-size:12.5px;font-weight:800}
.log-amt{font-size:13px;font-weight:900}
.log-meta{font-size:10.5px;color:var(--text3);margin-top:2px}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{background:var(--gold-l);color:var(--navy);font-weight:800;padding:9px 7px;text-align:center;font-size:11.5px;border:1px solid var(--border)}
.tbl td{padding:8px 7px;text-align:center;border:1px solid var(--border);font-weight:600}
.tbl td.nm{text-align:start;font-weight:700}
.chk{width:19px;height:19px;accent-color:var(--gold);cursor:pointer}

#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:11px;font-size:13px;font-weight:700;z-index:9999;transition:transform .28s;box-shadow:0 8px 26px rgba(0,0,0,.28);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--green)}

.empty{text-align:center;padding:34px 16px;color:var(--text3);font-size:13px;font-weight:600}
.sec-title{font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:11px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
</style>
</head>

<div id="login">

    <div class="lg-logo">

    <div style="margin-bottom:16px">
      <label class="lbl" data-t="password">كلمة السر</label>

      <button class="btn btn-g btn-sm" onclick="toggleLang()" id="lg-lang">বাংলা</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">

    </div>
    <div class="nav-tabs" id="nv-tabs"></div>
  </div>

  <div class="wrap">

</div>

function tabArr(v){
  if(Array.isArray(v)) return v.filter(function(x){return typeof x==='string';});
  if(v&&typeof v==='object'){
    return Object.keys(v).map(function(k){return v[k];})
      .filter(function(x){return typeof x==='string';});
  }
  return null;
}

/* ═══════════ HELPERS ═══════════ */
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseInt(v,10);return isNaN(n)||n<0?0:n;}
function flt(v){var n=parseFloat(v);return isNaN(n)||n<0?0:n;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nowStr(){var d=new Date();return today()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

var toastTimer=null;
function toast(msg,kind){
  var e=el('toast');if(!e)return;
  e.textContent=msg;
  e.className='show'+(kind==='err'?' err':kind==='ok'?' ok':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){e.className='';},2600);
}

function fb(path,dflt){
  return fetch(DB+'/'+path+'.json').then(function(r){return r.json();})
    .then(function(d){return d==null?dflt:d;}).catch(function(){return dflt;});
}
function fbSet(path,v){
  var body=JSON.stringify(v);
  function once(){
    return fetch(DB+'/'+path+'.json',{method:'PUT',
      headers:{'Content-Type':'application/json'},body:body})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r;});
  }
  return once().catch(function(){return once();});
}
function fbPatch(path,v){
  var body=JSON.stringify(v);
  function once(){
    return fetch(DB+'/'+path+'.json',{method:'PATCH',
      headers:{'Content-Type':'application/json'},body:body})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r;});
  }
  return once().catch(function(){return once();});
}
/* حفظ كمية واحد مع تأكيد فعلي من القاعدة */
function saveQtyKV(pid,qty){
  var o={}; o[pid]=qty;
  return fbPatch('hz4_qty',o).then(function(){
    return fetch(DB+'/hz4_qty/'+pid+'.json').then(function(r){return r.json();});
  }).then(function(v){
    if(num(v)!==num(qty)) throw new Error('verify failed');
    return true;
  });
}

function toggleLang(){
  LANG = LANG==='ar' ? 'bn' : 'ar';
  applyLang();
  try{localStorage.setItem('hz_sc_lang',LANG);}catch(e){}
  if(CU){buildTabs();render();}
}
function applyLang(){
  var isBn = LANG==='bn';
  document.documentElement.lang = isBn?'bn':'ar';
  document.documentElement.dir  = isBn?'ltr':'rtl';
  document.body.className = isBn?'bn':'';
  var label = isBn?'العربية':'বাংলা';
  var b1=el('nav-lang'); if(b1) b1.textContent=label;
  var b2=el('lg-lang');  if(b2) b2.textContent=label;
  var nodes=document.querySelectorAll('[data-t]');
  for(var i=0;i<nodes.length;i++){
    nodes[i].textContent=t(nodes[i].getAttribute('data-t'));
  }
  document.title='Hallazone — '+t('stockControl');
  if(CU){var r=el('nv-role'); if(r) r.textContent=t(ROLE_LABEL[CU.role]||'rSales');}
}

/* ═══════════ PERMISSIONS ═══════════ */
function myTabs(){
  var r=roles[CU?CU.role:'sales'];
  var list=(r&&Array.isArray(r.s))?r.s:['dash'];
  return list.filter(function(x){return S_TABS.indexOf(x)>-1;});
}
function can(tab){return myTabs().indexOf(tab)>-1;}
function gotoQuotes(){
  try{ window.location.assign('index.html'); }
  catch(e){ window.location.href='index.html'; }
}

function buildTabs(){
  var box=el('nv-tabs'); if(!box) return;
  box.innerHTML=myTabs().map(function(tb){
    return '<button class="tab'+(tb===page?' active':'')+'" data-tab="'+tb+'" '
      +'onclick="go(this.getAttribute(\'data-tab\'))">'+esc(t(S_LABEL[tb]||tb))+'</button>';
  }).join('')
  +'<button type="button" class="tab" style="background:#b8912f;color:#fff;font-weight:900;white-space:nowrap" '
  +'onclick="gotoQuotes()">\u2699 '+esc(t('quotesSystem'))+'</button>';
}

function doLogin(){
  var un=(el('lg-un').value||'').trim().toLowerCase();
  var pw=(el('lg-pw').value||'').trim();
  var u=users.find(function(x){return String(x.un).toLowerCase()===un&&String(x.pw)===pw;});
  if(!u){toast(t('wrongLogin'),'err');return;}
  CU=u;
  try{localStorage.setItem('hz_sc_user',JSON.stringify(u));}catch(e){}
  startApp();

/* ═══════════ DATA ═══════════ */
function loadAll(){
  return Promise.all([
    fb('hz4_qty',{}), fb('hz4_u',IU), fb('hz4_sc_log',[]),
    fb('hz4_sc_min',{}), fb('hz4_custom',{}), fb('hz4_roles',null),
    fb('hz4_sc_set',null), fb('hz4_sc_batch',{}), fb('hz4_sc_sup',[]),
    fb('hz4_brand_class',{}), fb('hz4_sc_lastcount',null), fb('hz4_sc_po',{})
  ]).then(function(r){
    var qty=r[0]||{}, dbU=r[1], dbL=r[2], dbM=r[3], dbC=r[4], dbR=r[5],
        dbS=r[6], dbB2=r[7], dbSup=r[8], dbBC=r[9], dbLC=r[10], dbPO=r[11];
    SET={};
    Object.keys(DEF_SET).forEach(function(k){SET[k]=DEF_SET[k];});
    if(dbS&&typeof dbS==='object')
      Object.keys(DEF_SET).forEach(function(k){
        if(dbS[k]!==undefined&&dbS[k]!==null) SET[k]=dbS[k];
      });
    LOW_DEFAULT=num(SET.lowDefault)||20;
    batches=(dbB2&&typeof dbB2==='object')?Object.keys(dbB2).map(function(k){
      var b=dbB2[k]; if(!b||!b.pid) return null;
      return {key:k,pid:b.pid,pname:b.pname||'',batch:b.batch||'',
              exp:b.exp||'',qty:num(b.qty),date:b.date||'',by:b.by||''};
    }).filter(Boolean):[];
    batches.sort(function(a,b){return (a.exp||'9999').localeCompare(b.exp||'9999');});
    sups=(Array.isArray(dbSup)?dbSup:(dbSup?Object.values(dbSup):[]))
      .filter(function(x){return x&&x.name;});
    brandClass=(dbBC&&typeof dbBC==='object')?dbBC:{};
    lastCount=(dbLC&&dbLC.date)?dbLC:null;
    poOrders=[];
    if(dbPO&&typeof dbPO==='object'){
      Object.keys(dbPO).forEach(function(k){
        var o=dbPO[k]; if(!o||!o.no) return;
        if(!Array.isArray(o.items)&&o.items&&typeof o.items==='object')
          o.items=Object.keys(o.items).map(function(j){return o.items[j];});
        poOrders.push(o);
      });
      poOrders.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    }

    prods=IP.map(function(ip){
      var q=qty[ip.id];
      return {id:ip.id,sku:ip.sku||ip.id,brand:ip.brand,name:ip.name,price:ip.price,
              salePrice:ip.salePrice,img:ip.img,
              qty:(q===undefined||q===null)?num(ip.qty):num(q),
              active:qty[ip.id+'_off']?false:true, custom:false};
    });
    custom=(dbC&&typeof dbC==='object')?dbC:{};
    Object.keys(custom).forEach(function(k){
      var cp=custom[k];
      if(!cp||!cp.id||!cp.name) return;
      if(prods.some(function(p){return p.id===cp.id;})) return;
      var q=qty[cp.id];
      prods.push({id:cp.id,sku:cp.sku||cp.id,brand:cp.brand||'',name:cp.name,price:cp.price||0,
        img:cp.img||null,qty:(q===undefined||q===null)?num(cp.qty):num(q),
        active:cp.active!==false, custom:true});
    });

    users=Array.isArray(dbU)?dbU:(dbU?Object.values(dbU):IU);
    users=users.filter(function(u){return u&&u.un;});
    if(!users.length) users=IU;

    logs=Array.isArray(dbL)?dbL:(dbL?Object.values(dbL):[]);
    logs=logs.filter(function(x){return x&&x.pid;});
    logs.sort(function(a,b){return (b.ts||0)-(a.ts||0);});

    mins=(dbM&&typeof dbM==='object')?dbM:{};

    roles={};
    Object.keys(DEF_ROLES).forEach(function(k){
      roles[k]={q:DEF_ROLES[k].q.slice(), s:DEF_ROLES[k].s.slice()};
    });
    if(dbR&&typeof dbR==='object'){
      Object.keys(dbR).forEach(function(k){
        var v=dbR[k]; if(!v) return;
        if(!roles[k]) roles[k]={q:['dash'],s:['dash']};
        var vq=tabArr(v.q), vs=tabArr(v.s);
        if(vq) roles[k].q=vq.filter(function(x){return Q_TABS.indexOf(x)>-1;});
        if(vs) roles[k].s=vs.filter(function(x){return S_TABS.indexOf(x)>-1;});
      });
    }
    /* المدير: نضمن فقط عدم إقفال نفسه خارج الصلاحيات والرئيسية */
    LOCKED_ADMIN.s.forEach(function(tb){
      if(roles.admin.s.indexOf(tb)<0) roles.admin.s.push(tb);
    });
    LOCKED_ADMIN.q.forEach(function(tb){
      if(roles.admin.q.indexOf(tb)<0) roles.admin.q.push(tb);
    });
  });
}

function money(v){
  var n=Number(v)||0;
  return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',')+' '+t('riyal');
}
function minOf(pid){var m=mins[pid];return (m===undefined||m===null)?LOW_DEFAULT:num(m);}
function statusOf(p){
  if(p.qty<=0) return 'out';
  if(p.qty<=minOf(p.id)) return 'low';
  return 'ok';
}
function actives(){return prods.filter(function(p){return p.active;});}

function addLog(pid,type,delta,before,after,note){
  var p=prods.find(function(x){return x.id===pid;});
  logs.unshift({
    id:'m'+Date.now()+Math.floor(Math.random()*900),
    pid:pid, pname:(p?(p.brand+' - '+p.name):pid),
    type:type, delta:delta, before:before, after:after,
    note:note||'', by:CU?CU.name:'-', ts:Date.now(), date:nowStr()
  });
  if(logs.length>400) logs=logs.slice(0,400);
  return fbSet('hz4_sc_log',logs);
}

/* ── حفظ تلقائي: يكتب الرقم فيُحفظ وحده ويتأكد من وصوله ── */
var qtyTimers={};
function qtyChanged(pid){
  var st=el('qs-'+pid); if(st){st.textContent='…';st.style.color='var(--amber)';}
  clearTimeout(qtyTimers[pid]);
  qtyTimers[pid]=setTimeout(function(){qtyFlush(pid);},700);
}
function qtyFlush(pid){
  clearTimeout(qtyTimers[pid]);
  var inp=el('q-'+pid); if(!inp) return;
  var newQ=num(inp.value);
  var p=prods.find(function(x){return x.id===pid;}); if(!p) return;
  var before=p.qty;
  if(before===newQ){
    var st0=el('qs-'+pid); if(st0){st0.textContent='';}
    return;
  }
  p.qty=newQ;
  saveQtyKV(pid,newQ)
    .then(function(){return addLog(pid,'set',newQ-before,before,newQ,t('setQty'));})
    .then(function(){
      var st=el('qs-'+pid);
      if(st){st.textContent='\u2713';st.style.color='var(--green)';}
      inp.classList.add('saved');
      setTimeout(function(){
        inp.classList.remove('saved');
        var s2=el('qs-'+pid); if(s2)s2.textContent='';
      },1600);
    })
    .catch(function(){
      p.qty=before;
      var st=el('qs-'+pid);
      if(st){st.textContent='\u2717';st.style.color='var(--red)';}
      toast(t('savingErr'),'err');
    });
}

function exportCsv(){
  var rows=[['id','brand','name','price','qty','value','status']];
  actives().forEach(function(p){
    rows.push([p.id,p.brand,p.name,(p.price||0),(p.qty||0),
      ((p.qty||0)*(p.price||0)).toFixed(2),statusOf(p)]);
  });
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).split('"').join('""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='hallazone_stock_'+today()+'.csv';
  a.click();
  toast(t('saved'),'ok');
}

     +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(p.name)+'</div>'
     +'<div class="row-brand">'+esc(p.brand)+'</div></div>'
     +'<div style="font-weight:900;font-size:14px;color:var(--navy)">'+p.qty+'</div></div>';
  }).join('');
}
function pickProd(pid){
  var p=prods.find(function(x){return x.id===pid;}); if(!p) return;
  selPid=pid;
  el('m-selname').textContent=p.brand+' - '+p.name;
  el('m-selqty').textContent=p.qty;
  el('m-sel').classList.remove('hidden');
  el('m-pick').innerHTML='';
  el('m-srch').value=p.name;
  var a=el('m-amt'); if(a){a.value='';a.focus();}
  var n=el('m-new'); if(n) n.value=p.qty;
}
function previewMove(mode){
  if(!selPid) return;
  var p=prods.find(function(x){return x.id===selPid;}); if(!p) return;
  var amt=num(el('m-amt').value);
  var n=el('m-new'); if(n) n.value=mode==='recv'?p.qty+amt:Math.max(0,p.qty-amt);
}
function doMove(mode){
  if(!selPid){toast(t('selectProductFirst'),'err');return;}
  var amt=num(el('m-amt').value);
  if(amt<=0){toast(t('enterAmount'),'err');return;}
  var p=prods.find(function(x){return x.id===selPid;}); if(!p) return;
  var before=p.qty, after=mode==='recv'?before+amt:Math.max(0,before-amt);
  var noteEl=el('m-note'), rsnEl=el('m-reason');
  var note=noteEl?noteEl.value.trim():'';
  var supN=mode==='recv'?supName():'';
  if(supN) note=t('supplier')+': '+supN+(note?' — '+note:'');
  if(mode==='issue'&&rsnEl){
    var map={sale:t('reasonSale'),damage:t('reasonDamage'),sample:t('reasonSample'),
             'return':t('reasonReturn'),other:t('reasonOther')};
    note=(map[rsnEl.value]||'')+(note?' — '+note:'');
  }
  p.qty=after;
  var patch={}; patch[selPid]=after;
  var bEl=el('m-batch'), eEl=el('m-exp');
  var bNo=bEl?bEl.value.trim():'', bExp=eEl?eEl.value:'';
  fbPatch('hz4_qty',patch)
    .then(function(){return ensureSupplier(supN);})
    .then(function(){return addLog(selPid,mode==='recv'?'in':'out',after-before,before,after,note);})
    .then(function(){
      if(mode==='recv'&&(bNo||bExp)){
        var key='b'+Date.now()+Math.floor(Math.random()*900);
        var rec={pid:selPid,pname:p.brand+' - '+p.name,batch:bNo,exp:bExp,
                 qty:amt,date:today(),by:CU?CU.name:'-',sup:supN};
        var bp={}; bp[key]=rec;
        batches.push(Object.assign({key:key},rec));
        batches.sort(function(a,b){return (a.exp||'9999').localeCompare(b.exp||'9999');});
    sups=(Array.isArray(dbSup)?dbSup:(dbSup?Object.values(dbSup):[]))
      .filter(function(x){return x&&x.name;});
    brandClass=(dbBC&&typeof dbBC==='object')?dbBC:{};
    lastCount=(dbLC&&dbLC.date)?dbLC:null;
    poOrders=[];
    if(dbPO&&typeof dbPO==='object'){
      Object.keys(dbPO).forEach(function(k){
        var o=dbPO[k]; if(!o||!o.no) return;
        if(!Array.isArray(o.items)&&o.items&&typeof o.items==='object')
          o.items=Object.keys(o.items).map(function(j){return o.items[j];});
        poOrders.push(o);
      });
      poOrders.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    }
        return fbPatch('hz4_sc_batch',bp);
      }
    })
    .then(function(){
      toast((mode==='recv'?t('received'):t('issued'))+' — '+amt+' '+t('pcs'),'ok');
      renderMove(mode);
    })
    .catch(function(){p.qty=before;toast(t('savingErr'),'err');});
}

function renderCount(){

    +'<div style="font-size:12.5px;font-weight:800;color:'+(lastCount.date===today()?'var(--green)':'var(--amber)')+'">'
    +esc(lastCount.date===today()?t('countToday'):t('countNotToday'))+'</div>'
    +'<div style="font-size:11px;color:var(--text2);margin-top:3px">'
    +esc(t('lastCount'))+': '+esc(lastCount.date)+' &middot; '+esc(lastCount.by||'')
    +' &middot; '+esc(String(lastCount.items||0))+' '+esc(t('items'))+'</div></div>'
   :'';

   '<div class="page-title">'+esc(t('countTitle'))+' <span class="pill p-info">'+esc(t('dailyCount'))+'</span></div>'

function drawCount(){
  var box=el('c-srch'), q=box?box.value.trim():'';
  var list=actives();
  if(q) list=list.filter(function(p){return (p.name+' '+p.brand).indexOf(q)>-1;});
  else list=list.slice(0,60);
  var out=el('c-list'); if(!out) return;
  out.innerHTML=list.length?list.slice(0,150).map(countRow).join('')
    :'<div class="empty">'+esc(t('noResults'))+'</div>';
}
function countRow(p){
  var v=countData[p.id];
  var has=v!==undefined&&v!==null;
  var diff=has?(num(v)-p.qty):0;
  var col=diff>0?'var(--green)':diff<0?'var(--red)':'var(--text3)';
  return '<div class="row">'+imgTag(p,40)
   +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(p.name)+'</div>'
   +'<div class="row-brand">'+esc(t('systemQty'))+': '+p.qty
   +(has?' &middot; <b style="color:'+col+'">'+(diff>0?'+':'')+diff+'</b>':'')+'</div></div>'
   +'<input type="number" class="qty-inp" id="c-'+p.id+'" value="'+(has?num(v):'')+'" min="0" inputmode="numeric" '
   +'placeholder="'+esc(t('physicalQty'))+'" data-pid="'+p.id+'" '
   +'oninput="setCount(this.getAttribute(\'data-pid\'),this.value)" style="width:82px">'
   +'</div>';
}
function setCount(pid,val){
  if(String(val).trim()==='') delete countData[pid];
  else countData[pid]=num(val);
  drawCountSum();
}
function drawCountSum(){
  var box=el('c-sum'); if(!box) return;
  var ids=Object.keys(countData);
  var diffs=ids.filter(function(id){
    var p=prods.find(function(x){return x.id===id;});
    return p && num(countData[id])!==p.qty;
  });
  if(!ids.length){box.className='card hidden';return;}
  box.className='card';
  box.style.borderColor='var(--blue)';
  box.style.background='var(--blue-l)';
  box.innerHTML=
   '<div class="sec-title" style="color:var(--blue)">'+esc(t('variance'))+': '+diffs.length+' / '+ids.length+' '+esc(t('items'))+'</div>'
  +(diffs.length?diffs.slice(0,20).map(function(id){
      var p=prods.find(function(x){return x.id===id;});
      var d=num(countData[id])-p.qty;
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0">'
       +'<span style="font-weight:700">'+esc(p.name)+'</span>'
       +'<span style="font-weight:900;color:'+(d>0?'var(--green)':'var(--red)')+'">'+(d>0?'+':'')+d+'</span></div>';
    }).join('')+(diffs.length>20?'<div class="empty" style="padding:8px">+ '+(diffs.length-20)+'</div>':'')
   :'<div style="font-size:12px;color:var(--text2)">'+esc(t('noVariance'))+'</div>')
  +'<div style="display:flex;gap:8px;margin-top:12px">'
  +'<button class="btn btn-n" style="flex:1" onclick="applyCount()">'+esc(t('applyCount'))+'</button>'
  +'<button class="btn btn-g" onclick="clearCount()">'+esc(t('clearCount'))+'</button></div>';
}
function clearCount(){countData={};renderCount();}
function applyCount(){
  var ids=Object.keys(countData).filter(function(id){
    var p=prods.find(function(x){return x.id===id;});
    return p && num(countData[id])!==p.qty;
  });
  if(!ids.length){toast(t('noVariance'),'ok');return;}
  var patch={}, pending=[];
  ids.forEach(function(id){
    var p=prods.find(function(x){return x.id===id;});
    var before=p.qty, after=num(countData[id]);
    patch[id]=after;
    pending.push({pid:id,before:before,after:after});
    p.qty=after;
  });
  fbPatch('hz4_qty',patch).then(function(){
    pending.forEach(function(x){
      var p=prods.find(function(y){return y.id===x.pid;});
      logs.unshift({id:'m'+Date.now()+Math.floor(Math.random()*900),
        pid:x.pid,pname:(p?(p.brand+' - '+p.name):x.pid),type:'count',
        delta:x.after-x.before,before:x.before,after:x.after,
        note:t('countNote'),by:CU?CU.name:'-',ts:Date.now(),date:nowStr()});
    });
    if(logs.length>400) logs=logs.slice(0,400);
    return fbSet('hz4_sc_log',logs);
  }).then(function(){
    lastCount={date:today(),by:CU?CU.name:'-',items:ids.length,ts:Date.now()};
    return fbSet('hz4_sc_lastcount',lastCount);
  }).then(function(){
    countData={};
    toast(t('countDone')+' — '+ids.length+' '+t('items'),'ok');
    renderCount();
  }).catch(function(){toast(t('savingErr'),'err');});
}

  var lbl=st==='received'?t('poReceived'):st==='sent'?t('poSent'):st==='cancelled'?t('poCancelled'):t('poDraft');

   +(st==='sent'?'<button type="button" class="btn btn-ok btn-sm" data-k="'+o.no+'" onclick="poMark(this.getAttribute(\'data-k\'),\'received\')">'+esc(t('poMarkRecv'))+'</button>':'')

function poPick(){
  var box=el('po-srch'), q=box?box.value.trim():'';
  var out=el('po-pick'); if(!out) return;
  if(!q){out.innerHTML='';return;}
  var qq=q.toLowerCase();
  var list=actives().filter(function(p){
    return (p.name+' '+p.brand).indexOf(q)>-1||prodCode(p).toLowerCase().indexOf(qq)>-1;
  }).slice(0,25);
  out.innerHTML=list.length?list.map(function(p){
    return '<div class="row" style="cursor:pointer;margin-bottom:6px;padding:8px" data-pid="'+p.id+'" '
     +'onclick="poAdd(this.getAttribute(\'data-pid\'))">'+imgTag(p,34)
     +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(p.name)+'</div>'
     +'<div class="row-brand">'+esc(p.brand)+' &middot; '+esc(prodCode(p))+' &middot; '+money(p.price||0)+'</div></div>'

  }).join(''):'<div class="empty" style="padding:12px">'+esc(t('noResults'))+'</div>';

function poAdd(pid){
  var p=prods.find(function(x){return x.id===pid;}); if(!p) return;
  var ex=null;
  for(var i=0;i<poItems.length;i++){ if(poItems[i].pid===pid){ex=poItems[i];break;} }
  if(ex){ ex.qty=ex.qty+1; }
  else {
    var sug=Math.max(1, minOf(pid)*2-p.qty);
    poItems.push({pid:pid,sku:prodCode(p),brand:p.brand,name:p.name,
                  price:p.salePrice||p.price||0,qty:sug});
  }
  el('po-srch').value='';
  renderPO();
}
function poQtySet(i,v){
  var idx=parseInt(i,10); if(isNaN(idx)||!poItems[idx]) return;
  poItems[idx].qty=Math.max(1,num(v));
  var tot=poItems.reduce(function(a,it){return a+(it.qty*(it.price||0));},0);
  var box=el('po-total'); if(box) box.textContent=money(tot);
}
function poDel(i){
  var idx=parseInt(i,10); if(isNaN(idx)) return;
  poItems.splice(idx,1); renderPO();
}
function poFromReorder(){
  var rows=reorderRows();
  if(!rows.length){toast(t('nothingToReorder'),'err');return;}
  rows.forEach(function(r){
    var dup=false;
    for(var i=0;i<poItems.length;i++){ if(poItems[i].pid===r.p.id){dup=true;break;} }
    if(dup) return;
    poItems.push({pid:r.p.id,sku:prodCode(r.p),brand:r.p.brand,name:r.p.name,
                  price:r.p.salePrice||r.p.price||0,qty:Math.max(1,r.sug)});
  });
  toast(t('poImported')+' — '+rows.length,'ok');
  renderPO();
}
function poSave(){
  if(!poItems.length){toast(t('poNoItems'),'err');return;}
  var no=poEditing?poEditing.no:('PO-'+String(Date.now()).slice(-8));
  var o={no:no, date:el('po-date')?el('po-date').value:today(),
    forWho:el('po-for')?el('po-for').value.trim():'',
    notes:el('po-notes')?el('po-notes').value.trim():'',
    by:CU?CU.name:'-', status:poEditing?(poEditing.status||'draft'):'draft',
    items:poItems.map(function(it){
      return {pid:it.pid,sku:it.sku,brand:it.brand,name:it.name,price:it.price,qty:it.qty};
    }), ts:Date.now()};
  var pt={}; pt[no]=o;
  fbPatch('hz4_sc_po',pt).then(function(){
    var found=false;
    for(var i=0;i<poOrders.length;i++){ if(poOrders[i].no===no){poOrders[i]=o;found=true;break;} }
    if(!found) poOrders.unshift(o);
    poOrders.sort(function(a,b){return (b.ts||0)-(a.ts||0);});
    var supN=o.forWho;
    poItems=[]; poEditing=null;
    toast(t('poSaved')+' — '+no,'ok');
    renderPO();
    return supN?ensureSupplier(supN):null;
  }).catch(function(){toast(t('savingErr'),'err');});
}
function poLoad(no){
  var o=null;
  for(var i=0;i<poOrders.length;i++){ if(poOrders[i].no===no){o=poOrders[i];break;} }
  if(!o) return;
  poEditing=o;
  poItems=(o.items||[]).map(function(it){
    return {pid:it.pid,sku:it.sku,brand:it.brand,name:it.name,price:it.price,qty:it.qty};
  });
  renderPO();
  poPrint();
}
function poMark(no,st){
  var o=null;
  for(var i=0;i<poOrders.length;i++){ if(poOrders[i].no===no){o=poOrders[i];break;} }
  if(!o) return;
  var pt={}; pt[no+'/status']=st;
  fbPatch('hz4_sc_po',pt).then(function(){
    o.status=st; toast(t('saved'),'ok'); renderPO();
  }).catch(function(){toast(t('savingErr'),'err');});
}
function poDelOrder(no){
  if(!confirm(t('confirmDelete'))) return;
  fbSet('hz4_sc_po/'+no,null).then(function(){
    poOrders=poOrders.filter(function(x){return x.no!==no;});
    toast(t('deletedProduct'),'ok'); renderPO();
  }).catch(function(){toast(t('savingErr'),'err');});
}
function poPrint(){
  if(!poItems.length){toast(t('poNoItems'),'err');return;}
  var no=poEditing?poEditing.no:('PO-'+String(Date.now()).slice(-8));
  var forWho=el('po-for')?el('po-for').value.trim():'';
  var dt=el('po-date')?el('po-date').value:today();
  var nt=el('po-notes')?el('po-notes').value.trim():'';
  var total=poItems.reduce(function(a,it){return a+(it.qty*(it.price||0));},0);
  var qtyTot=poItems.reduce(function(a,it){return a+it.qty;},0);
  var rows=poItems.map(function(it,i){
    return '<tr><td>'+(i+1)+'</td><td>'+esc(it.sku||'')+'</td>'
     +'<td style="text-align:right">'+esc(it.brand?it.brand+' - '+it.name:it.name)+'</td>'
     +'<td>'+it.qty+'</td><td>'+money(it.price||0)+'</td>'
     +'<td><b>'+money(it.qty*(it.price||0))+'</b></td></tr>';
  }).join('');

function drawRetPick(){

  }).slice(0,25);

function pickRet(pid){
  var p=prods.find(function(x){return x.id===pid;}); if(!p) return;
  retPid=pid;
  el('r-selname').textContent=p.brand+' - '+p.name;
  el('r-selqty').textContent=p.qty;
  el('r-sel').classList.remove('hidden');
  el('r-pick').innerHTML='';
  el('r-srch').value=p.name;
  var a=el('r-amt'); if(a){a.value='';a.focus();}
}
function doReturn(){
  if(!retPid){toast(t('selectProductFirst'),'err');return;}
  var amt=num(el('r-amt').value);
  if(amt<=0){toast(t('enterAmount'),'err');return;}
  var p=prods.find(function(x){return x.id===retPid;}); if(!p) return;
  var restock=el('r-restock')&&el('r-restock').checked;
  var rmap={customer:t('rCustomer'),damage:t('reasonDamage'),
            expired:t('rExpiredR'),other:t('reasonOther')};
  var rEl=el('r-reason');
  var note=(rmap[rEl?rEl.value:'other']||'');
  var nEl=el('r-note'); if(nEl&&nEl.value.trim()) note+=' — '+nEl.value.trim();
  var before=p.qty, after=restock?before+amt:before;
  var chain=Promise.resolve();
  if(restock){
    p.qty=after;
    chain=saveQtyKV(retPid,after);
  }
  chain.then(function(){
    logs.unshift({id:'m'+Date.now()+Math.floor(Math.random()*900),
      pid:retPid,pname:p.brand+' - '+p.name,type:'return',
      delta:restock?amt:0,before:before,after:after,
      note:note,by:CU?CU.name:'-',ts:Date.now(),date:nowStr()});
    if(logs.length>400) logs=logs.slice(0,400);
    return fbSet('hz4_sc_log',logs);
  }).then(function(){
    toast(t('returnSaved')+' — '+amt+' '+t('pcs'),'ok');
    renderReturns();
  }).catch(function(){
    if(restock) p.qty=before;
    toast(t('savingErr'),'err');
  });
}

/* ═══════════ REPORTS ═══════════ */
function renderReports(){
  var cutoff=Date.now()-DEAD_DAYS*864e5;
  var moved={};
  logs.forEach(function(m){
    if((m.ts||0)>=cutoff && m.type==='out')
      moved[m.pid]=(moved[m.pid]||0)+Math.abs(m.delta||0);
  });
  var touched={};
  logs.forEach(function(m){ if((m.ts||0)>=cutoff) touched[m.pid]=1; });

  var list=actives();
  var dead=list.filter(function(p){return p.qty>0 && !touched[p.id];})
    .sort(function(a,b){return (b.qty*(b.price||0))-(a.qty*(a.price||0));});
  var top=Object.keys(moved).map(function(pid){
    var p=prods.find(function(x){return x.id===pid;});
    return {name:p?(p.brand+' - '+p.name):pid, qty:moved[pid]};
  }).sort(function(a,b){return b.qty-a.qty;}).slice(0,12);

  var byBrand={};
  list.forEach(function(p){
    var b=p.brand||'—';
    if(!byBrand[b]) byBrand[b]={v:0,n:0};
    byBrand[b].v+=(p.qty||0)*(p.price||0);
    byBrand[b].n++;
  });
  var brands=Object.keys(byBrand).map(function(b){
    return {b:b,v:byBrand[b].v,n:byBrand[b].n};
  }).sort(function(a,b){return b.v-a.v;}).slice(0,15);
  var totalV=list.reduce(function(s,p){return s+(p.qty||0)*(p.price||0);},0);

  el('pg-reports').innerHTML=
   '<div class="page-title">'+esc(t('reports'))+'</div>'

  +'<div class="card"><div class="sec-title">'+esc(t('topMovers'))
  +' <span style="font-weight:600;color:var(--text3);font-size:11px">'+esc(t('topMoversSub'))+'</span></div>'
  +(top.length?'<div class="scroll-x"><table class="tbl"><tr><th>#</th><th>'+esc(t('product'))+'</th><th>'+esc(t('movedQty'))+'</th></tr>'
    +top.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td class="nm">'+esc(x.name)+'</td>'
      +'<td style="font-weight:900;color:var(--green)">'+x.qty+'</td></tr>';}).join('')
    +'</table></div>'
   :'<div class="empty">'+esc(t('noMoves'))+'</div>')+'</div>'

  +'<div class="card"><div class="sec-title">'+esc(t('deadStock'))
  +' <span style="font-weight:600;color:var(--text3);font-size:11px">'+esc(t('deadStockSub'))+'</span></div>'
  +(dead.length?'<div class="scroll-x"><table class="tbl"><tr><th>'+esc(t('product'))+'</th><th>'+esc(t('quantity'))+'</th><th>'+esc(t('totalValue'))+'</th></tr>'
    +dead.slice(0,25).map(function(p){
      return '<tr><td class="nm">'+esc(p.brand+' - '+p.name)+'</td><td>'+p.qty+'</td>'
       +'<td style="font-weight:800;color:var(--amber)">'+((p.qty||0)*(p.price||0)).toFixed(0)+'</td></tr>';
    }).join('')+'</table></div>'
    +(dead.length>25?'<div class="empty" style="padding:8px">+ '+(dead.length-25)+'</div>':'')
   :'<div class="empty">'+esc(t('noDead'))+'</div>')+'</div>'

  +'<div class="card"><div class="sec-title">'+esc(t('byBrand'))+'</div>'
  +'<div class="scroll-x"><table class="tbl"><tr><th>'+esc(t('brand'))+'</th><th>'+esc(t('items'))+'</th><th>'+esc(t('totalValue'))+'</th></tr>'
  +brands.map(function(x){
     return '<tr><td class="nm">'+esc(x.b)+'</td><td>'+x.n+'</td>'
      +'<td style="font-weight:800;color:var(--gold-d)">'+x.v.toLocaleString('en-US',{maximumFractionDigits:0})+'</td></tr>';
   }).join('')
  +'<tr style="background:var(--gold-l)"><td class="nm" style="font-weight:900">'+esc(t('totalValue'))+'</td>'
  +'<td style="font-weight:900">'+list.length+'</td>'
  +'<td style="font-weight:900;color:var(--gold-d)">'+totalV.toLocaleString('en-US',{maximumFractionDigits:0})+'</td></tr>'
  +'</table></div></div>';
}

function saveMin(pid){
  var inp=el('rp-'+pid); if(!inp) return;
  var v=num(inp.value);
  mins[pid]=v;
  var patch={}; patch[pid]=v;
  fbPatch('hz4_sc_min',patch).then(function(){
    inp.classList.add('saved');
    setTimeout(function(){inp.classList.remove('saved');},1400);
    toast(t('saved'),'ok');
  }).catch(function(){toast(t('savingErr'),'err');});
}
function addProd(){
  var name=(el('np-name').value||'').trim();
  if(!name){toast(t('fillFields'),'err');return;}
  var np={
    id:'c'+Date.now(),
    brand:(el('np-brand').value||'').trim(),
    name:name,
    price:flt(el('np-price').value),
    img:(el('np-img').value||'').trim()||null,
    qty:num(el('np-qty').value),
    active:true
  };
  var patch={}; patch[np.id]=np;
  fbPatch('hz4_custom',patch).then(function(){
    var q={}; q[np.id]=np.qty;
    return fbPatch('hz4_qty',q);
  }).then(function(){
    custom[np.id]=np;
    prods.push({id:np.id,brand:np.brand,name:np.name,price:np.price,
      img:np.img,qty:np.qty,active:true,custom:true});
    ['np-brand','np-name','np-price','np-img'].forEach(function(i){var e=el(i);if(e)e.value='';});
    var qe=el('np-qty'); if(qe) qe.value='0';
    toast(t('addedProduct')+': '+name,'ok');
    renderProducts();
  }).catch(function(){toast(t('savingErr'),'err');});
}
function toggleArchive(pid){
  var p=prods.find(function(x){return x.id===pid;}); if(!p) return;
  p.active=!p.active;
  if(p.custom){
    custom[pid]=custom[pid]||{};
    custom[pid].active=p.active;
    var pt={}; pt[pid]={active:p.active};
    fbPatch('hz4_custom',pt).catch(function(){});
  } else {
    var q={}; q[pid+'_off']=p.active?null:1;
    fbPatch('hz4_qty',q).catch(function(){});
  }
  toast(t('updated'),'ok');
  drawProds();
}
function delProd(pid){
  if(!confirm(t('confirmDelete'))) return;
  var pt={}; pt[pid]=null;
  fbPatch('hz4_custom',pt).then(function(){
    delete custom[pid];
    prods=prods.filter(function(p){return p.id!==pid;});
    toast(t('deletedProduct'),'ok');
    renderProducts();
  }).catch(function(){toast(t('savingErr'),'err');});
}

function saveUsersFb(list){
  users=list;

function saveUser(uid){
  var nameEl=el('ue-name-'+uid), unEl=el('ue-un-'+uid),
      pwEl=el('ue-pw-'+uid), roleEl=el('ue-role-'+uid);
  if(!nameEl||!unEl) return;
  var name=nameEl.value.trim(), un=unEl.value.trim(),
      pw=pwEl?pwEl.value.trim():'', role=roleEl?roleEl.value:'sales';
  if(!name||!un){toast(t('fillFields'),'err');return;}
  if(users.some(function(u){return u.id!==uid&&String(u.un).toLowerCase()===un.toLowerCase();})){
    toast(t('userExists'),'err');return;
  }
  var next=users.map(function(u){
    return u.id!==uid?u:{id:u.id,un:un,pw:pw||u.pw,name:name,role:role};
  });
  saveUsersFb(next).then(function(){
    if(CU&&CU.id===uid) CU=next.find(function(u){return u.id===uid;});
    try{if(CU)localStorage.setItem('hz_sc_user',JSON.stringify({un:CU.un,pw:CU.pw}));}catch(e){}
    toast(t('saved'),'ok');
    startAppRefresh();

function permTable(sys,title,tabs,labels,rls){
  var h='<div class="card"><div class="sec-title">'+esc(title)+'</div><div class="scroll-x">'
   +'<table class="tbl"><tr><th>'+esc(t('role'))+'</th>'
   +tabs.map(function(tb){return '<th>'+esc(t(labels[tb]||tb))+'</th>';}).join('')+'</tr>';
  rls.forEach(function(r){
    var allowed=(roles[r]&&roles[r][sys])||[];
    h+='<tr><td class="nm">'+esc(t(ROLE_LABEL[r]))+'</td>'
     +tabs.map(function(tb){
        var on=allowed.indexOf(tb)>-1;
        var lock=(tb==='dash')||(r==='admin'&&LOCKED_ADMIN[sys].indexOf(tb)>-1);
        return '<td><input type="checkbox" class="chk" data-sys="'+sys+'" data-role="'+r+'" data-tab="'+tb+'"'
         +((on||lock)?' checked':'')+(lock?' disabled title="'+esc(t('lockedPerm'))+'"':'')+'></td>';
      }).join('')+'</tr>';
  });
  return h+'</table></div>'
   +(sys==='q'?'':'')+'</div>';
}
function savePerms(){
  var next={};
  Object.keys(ROLE_LABEL).forEach(function(r){next[r]={q:[],s:[]};});
  var boxes=document.querySelectorAll('#pg-perms .chk');
  for(var i=0;i<boxes.length;i++){
    var b=boxes[i];
    if(!b.checked) continue;
    var r=b.getAttribute('data-role'), sys=b.getAttribute('data-sys'), tb=b.getAttribute('data-tab');
    if(next[r]&&next[r][sys]&&next[r][sys].indexOf(tb)<0) next[r][sys].push(tb);
  }
  /* الرئيسية إجبارية لكل دور حتى لا يبقى أحد بواجهة فارغة */
  Object.keys(next).forEach(function(r){
    if(next[r].q.indexOf('dash')<0) next[r].q.unshift('dash');
    if(next[r].s.indexOf('dash')<0) next[r].s.unshift('dash');
  });
  /* المدير: نعيد فقط الصفحات الحرجة التي تمنع إقفاله خارج النظام */
  LOCKED_ADMIN.s.forEach(function(tb){
    if(next.admin.s.indexOf(tb)<0) next.admin.s.push(tb);
  });
  LOCKED_ADMIN.q.forEach(function(tb){
    if(next.admin.q.indexOf(tb)<0) next.admin.q.push(tb);
  });
  fbSet('hz4_roles',next).then(function(){
    roles=next;
    toast(t('permsSaved'),'ok');
    buildTabs();
    renderPerms();
  }).catch(function(){toast(t('savingErr'),'err');});
}
function resetPerms(){
  if(!confirm(t('resetPerms')+'؟')) return;
  fbSet('hz4_roles',DEF_ROLES).then(function(){
    roles={};
    Object.keys(DEF_ROLES).forEach(function(k){
      roles[k]={q:DEF_ROLES[k].q.slice(),s:DEF_ROLES[k].s.slice()};
    });
    toast(t('permsSaved'),'ok');
    buildTabs();
    renderPerms();
  }).catch(function(){toast(t('savingErr'),'err');});
}

function daysBetween(dateStr){
  if(!dateStr) return null;
  var d=new Date(dateStr+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  var now=new Date(today()+'T00:00:00');
  return Math.round((d-now)/864e5);
}

/* ═══════════ REORDER ═══════════ */
function avgDailyOut(pid,days){
  var cutoff=Date.now()-days*864e5, tot=0;
  logs.forEach(function(m){
    if(m.pid===pid && m.type==='out' && (m.ts||0)>=cutoff) tot+=Math.abs(m.delta||0);
  });
  return tot/days;
}
function reorderRows(){
  var cover=num(SET.coverDays)||30;
  return actives().filter(function(p){return p.qty<=minOf(p.id);})
    .map(function(p){
      var avg=avgDailyOut(p.id,30);
      var target=Math.max(minOf(p.id)*2, Math.ceil(avg*cover));
      var sug=Math.max(0,target-p.qty);
      if(sug<=0) sug=Math.max(1,minOf(p.id));
      return {p:p, avg:avg, sug:sug, coverNow:avg>0?Math.floor(p.qty/avg):null};
    })
    .sort(function(a,b){
      if(a.p.qty!==b.p.qty) return a.p.qty-b.p.qty;
      return b.sug-a.sug;
    });
}
function renderReorder(){
  var rows=reorderRows();
  var h='<div class="head"><div class="page-title" style="margin:0">'+esc(t('reorderList'))+'</div>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
   +'<button class="btn btn-g btn-sm" onclick="exportReorder()">'+esc(t('exportCsv'))+'</button>'
   +'<button class="btn btn-ok btn-sm" onclick="sendWa(\'reorder\')">'+esc(t('sendWhatsapp'))+'</button>'
   +'<button class="btn btn-n btn-sm" onclick="sendMail(\'reorder\')">'+esc(t('sendEmail'))+'</button>'
   +'</div></div>'
   +'<div class="card"><div style="font-size:12px;color:var(--text2)">'+esc(t('reorderSub'))+'</div></div>';
  if(!rows.length){
    el('pg-reorder').innerHTML=h+'<div class="card"><div class="empty">'+esc(t('nothingToReorder'))+'</div></div>';
    return;
  }
  h+='<div class="card"><div class="scroll-x"><table class="tbl"><tr>'
   +'<th>'+esc(t('product'))+'</th><th>'+esc(t('quantity'))+'</th>'
   +'<th>'+esc(t('reorderPoint'))+'</th><th>'+esc(t('avgDaily'))+'</th>'
   +'<th>'+esc(t('coverDays'))+'</th><th>'+esc(t('suggestedQty'))+'</th></tr>'
   +rows.map(function(r){
      return '<tr><td class="nm">'+esc(r.p.brand+' - '+r.p.name)+'</td>'
       +'<td style="color:'+(r.p.qty<=0?'var(--red)':'var(--amber)')+';font-weight:800">'+r.p.qty+'</td>'
       +'<td>'+minOf(r.p.id)+'</td>'
       +'<td>'+r.avg.toFixed(1)+'</td>'
       +'<td>'+(r.coverNow===null?'—':r.coverNow)+'</td>'
       +'<td style="font-weight:900;color:var(--green)">'+r.sug+'</td></tr>';
    }).join('')
   +'</table></div></div>';
  el('pg-reorder').innerHTML=h;
}
function exportReorder(){
  var rows=reorderRows();
  if(!rows.length){toast(t('nothingToReorder'),'err');return;}
  var out=[['brand','name','current','reorderPoint','avgDaily','suggested']];
  rows.forEach(function(r){
    out.push([r.p.brand,r.p.name,r.p.qty,minOf(r.p.id),r.avg.toFixed(1),r.sug]);
  });
  downloadCsv(out,'hallazone_reorder_'+today()+'.csv');
}
function downloadCsv(rows,fname){
  var csv=rows.map(function(r){
    return r.map(function(c){return '"'+String(c).split('"').join('""')+'"';}).join(',');
  }).join('\n');
  var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname; a.click();
  toast(t('saved'),'ok');
}

/* ═══════════ NOTIFICATIONS ═══════════ */
function buildAlertText(kind){
  var lines=[];
  lines.push('*'+t('alertReport')+' — Hallazone*');
  lines.push(t('generatedOn')+': '+nowStr());
  lines.push('');
  if(kind==='reorder'){
    var rows=reorderRows();
    if(!rows.length) return null;
    lines.push('*'+t('reorderList')+'* ('+rows.length+')');
    rows.slice(0,40).forEach(function(r){
      lines.push('• '+r.p.brand+' - '+r.p.name+' | '+t('current')+': '+r.p.qty+' | '+t('suggestedQty')+': '+r.sug);
    });
    if(rows.length>40) lines.push('... +'+(rows.length-40));
  } else {
    var list=actives();
    var outL=list.filter(function(p){return p.qty<=0;});
    var lowL=list.filter(function(p){return p.qty>0&&p.qty<=minOf(p.id);});
    var warn=num(SET.expiryDays)||30;
    var expB=batches.filter(function(b){
      var d=daysBetween(b.exp); return d!==null&&d<=warn;
    });
    if(!outL.length&&!lowL.length&&!expB.length) return null;
    if(outL.length){
      lines.push('*'+t('outOfStock')+'* ('+outL.length+')');
      outL.slice(0,25).forEach(function(p){lines.push('• '+p.brand+' - '+p.name);});
      if(outL.length>25) lines.push('... +'+(outL.length-25));
      lines.push('');
    }
    if(lowL.length){
      lines.push('*'+t('lowStockAlert')+'* ('+lowL.length+')');
      lowL.slice(0,25).forEach(function(p){lines.push('• '+p.brand+' - '+p.name+': '+p.qty);});
      if(lowL.length>25) lines.push('... +'+(lowL.length-25));
      lines.push('');
    }
    if(expB.length){
      lines.push('*'+t('expiringSoon')+'* ('+expB.length+')');
      expB.slice(0,25).forEach(function(b){
        var d=daysBetween(b.exp);
        lines.push('• '+b.pname+' | '+b.exp+' | '+(d<0?Math.abs(d)+' '+t('daysAgo'):d+' '+t('daysLeft')));
      });
    }
  }
  return lines.join('\n');
}
function sendWa(kind){
  var wa=String(SET.wa||'').replace(/[^0-9]/g,'');
  if(!wa){toast(t('needWa'),'err');return;}
  var txt=buildAlertText(kind);
  if(!txt){toast(t('nothingToSend'),'ok');return;}
  window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(txt),'_blank');
}
function sendMail(kind){
  var svc=String(SET.ejsService||'').trim(),
      tpl=String(SET.ejsTemplate||'').trim(),
      key=String(SET.ejsKey||'').trim(),
      to =String(SET.email||'').trim();
  if(!svc||!tpl||!key||!to){toast(t('needEmail'),'err');return;}
  var txt=buildAlertText(kind);
  if(!txt){toast(t('nothingToSend'),'ok');return;}
  fetch('https://api.emailjs.com/api/v1.0/email/send',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({service_id:svc,template_id:tpl,user_id:key,
      template_params:{to_email:to,subject:t('alertReport')+' — Hallazone',
        message:txt.split('*').join(''),date:nowStr()}})
  }).then(function(r){
    if(r.ok) toast(t('emailSent'),'ok');
    else toast(t('emailFail'),'err');
  }).catch(function(){toast(t('emailFail'),'err');});
}

function allBrandsList(){
  var seen={}, out=[];
  prods.forEach(function(p){
    var b=(p.brand||'').trim();
    if(b&&!seen[b]){seen[b]=1;out.push(b);}
  });
  out.sort(function(a,b){return a.localeCompare(b,'ar');});
  return out;
}
function drawBrandList(){
  var box=el('st-bsrch'), q=box?box.value.trim():'';
  var out=el('st-blist'); if(!out) return;
  var list=allBrandsList();
  if(q) list=list.filter(function(b){return b.indexOf(q)>-1;});
  if(!list.length){out.innerHTML='<div class="empty" style="padding:12px">'+esc(t('noResults'))+'</div>';return;}
  out.innerHTML=list.slice(0,60).map(function(b){
    var own=brandClass[b]==='own';
    return '<div class="row" style="padding:8px">'
     +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(b)+'</div></div>'
     +'<button class="btn btn-sm '+(own?'btn-p':'btn-g')+'" data-b="'+esc(b)+'" '
     +'onclick="toggleBrand(this.getAttribute(\'data-b\'))">'
     +esc(own?t('ownBrands'):t('otherBrands'))+'</button></div>';
  }).join('')+(list.length>60?'<div class="empty" style="padding:8px">+ '+(list.length-60)+'</div>':'');
}
function toggleBrand(b){
  var next=brandClass[b]==='own'?null:'own';
  var pt={}; pt[b]=next;
  fbPatch('hz4_brand_class',pt).then(function(){
    if(next) brandClass[b]='own'; else delete brandClass[b];
    drawBrandList();
    toast(t('saved'),'ok');
  }).catch(function(){toast(t('savingErr'),'err');});
}

/* ── per-product thresholds ── */
function drawMinList(){
  var box=el('st-psrch'), q=box?box.value.trim():'';
  var out=el('st-plist'); if(!out) return;
  var list=actives();
  if(q) list=list.filter(function(p){return (p.name+' '+p.brand).indexOf(q)>-1;});
  else list=list.filter(function(p){return mins[p.id]!==undefined&&mins[p.id]!==null;});
  if(!list.length){
    out.innerHTML='<div class="empty" style="padding:16px">'
      +esc(q?t('noResults'):t('searchProduct'))+'</div>';
    return;
  }
  out.innerHTML=list.slice(0,40).map(function(p){
    return '<div class="row" style="padding:8px">'+imgTag(p,34)
     +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(p.name)+'</div>'
     +'<div class="row-brand">'+esc(p.brand)+' &middot; '+esc(t('current'))+': '+p.qty+'</div></div>'
     +'<input type="number" class="qty-inp" style="width:70px" id="rp-'+p.id+'" min="0" value="'+minOf(p.id)+'">'
     +'<button class="btn btn-p btn-sm" data-pid="'+p.id+'" onclick="saveMin(this.getAttribute(\'data-pid\'))">'
     +esc(t('save'))+'</button></div>';
  }).join('')+(list.length>40?'<div class="empty" style="padding:8px">+ '+(list.length-40)+'</div>':'');
}
function applyAllMins(){
  var v=num(el('st-low').value);
  if(!confirm(t('confirmApplyAll'))) return;
  var next={};
  prods.forEach(function(p){next[p.id]=v;});
  fbSet('hz4_sc_min',next).then(function(){
    mins=next;
    SET.lowDefault=v; LOW_DEFAULT=v||20;
    return fbPatch('hz4_sc_set',{lowDefault:v});
  }).then(function(){
    toast(t('appliedAll')+' — '+v,'ok');
    drawMinList();
  }).catch(function(){toast(t('savingErr'),'err');});
}

/* ── suppliers ── */
function supListHtml(){
  if(!sups.length) return '<div class="empty" style="padding:16px">'+esc(t('noSuppliers'))+'</div>';
  return sups.map(function(x,i){
    return '<div class="row" style="padding:9px">'
     +'<div class="row-ph" style="width:34px;height:34px;font-size:15px">&#127978;</div>'
     +'<div class="row-mid"><div class="row-name" style="font-size:12.5px">'+esc(x.name)+'</div>'
     +(x.phone?'<div class="row-brand">'+esc(x.phone)+'</div>':'')+'</div>'
     +'<button class="btn btn-r btn-sm" data-i="'+i+'" onclick="delSupplier(this.getAttribute(\'data-i\'))">&times;</button>'
     +'</div>';
  }).join('');
}
function addSupplier(){
  var n=(el('st-supname').value||'').trim();
  var ph=(el('st-supphone').value||'').trim();
  if(!n){toast(t('fillFields'),'err');return;}
  if(sups.some(function(x){return String(x.name).trim().toLowerCase()===n.toLowerCase();})){
    toast(t('supplierExists'),'err');return;
  }
  var next=sups.concat([{name:n,phone:ph,added:today()}]);
  fbSet('hz4_sc_sup',next).then(function(){
    sups=next;
    el('st-supname').value=''; el('st-supphone').value='';
    var lb=el('st-suplist'); if(lb) lb.innerHTML=supListHtml();
    toast(t('supplierAdded')+': '+n,'ok');
  }).catch(function(){toast(t('savingErr'),'err');});
}
function delSupplier(i){
  var idx=parseInt(i,10);
  if(isNaN(idx)||!sups[idx]) return;
  if(!confirm(t('confirmDelete'))) return;
  var next=sups.filter(function(x,j){return j!==idx;});
  fbSet('hz4_sc_sup',next).then(function(){
    sups=next;
    var lb=el('st-suplist'); if(lb) lb.innerHTML=supListHtml();
    toast(t('deletedProduct'),'ok');
  }).catch(function(){toast(t('savingErr'),'err');});
}

function saveSettings(){
  var next={
    lowDefault:num(el('st-low').value),
    expiryDays:Math.max(1,num(el('st-exp').value)||30),
    coverDays:Math.max(1,num(el('st-cover').value)||30),
    wa:String(el('st-wa').value||'').replace(/[^0-9]/g,''),
    email:String(el('st-email').value||'').trim(),
    ejsService:String(el('st-svc').value||'').trim(),
    ejsTemplate:String(el('st-tpl').value||'').trim(),
    ejsKey:String(el('st-key').value||'').trim()
  };
  fbSet('hz4_sc_set',next).then(function(){
    SET=next;
    LOW_DEFAULT=num(next.lowDefault)||20;
    toast(t('settingsSaved'),'ok');
  }).catch(function(){toast(t('savingErr'),'err');});
}

  try{toast(t('savingErr'),'err');}catch(e){}
});
(function(){
  try{
    var sl=localStorage.getItem('hz_sc_lang');
    if(sl==='bn'||sl==='ar') LANG=sl;
  }catch(e){}
  applyLang();

  /* استعادة الجلسة فوراً من الجهاز — لا انتظار للشبكة */
  var savedU=null;
  try{savedU=JSON.parse(localStorage.getItem('hz_sc_user')||'null');}catch(e){}
  if(savedU&&savedU.un){
    CU={id:savedU.id||'',un:savedU.un,pw:savedU.pw,name:savedU.name||savedU.un,
        role:savedU.role||'warehouse'};
    buildTabs(); startApp();
  }
  loadAll().then(function(){
    if(CU){
      var u=users.find(function(x){return x.un===CU.un;});
      if(u&&String(u.pw)===String(CU.pw)){
        CU=u;
        try{localStorage.setItem('hz_sc_user',JSON.stringify(u));}catch(e){}
      } else if(u){
        /* كلمة السر تغيّرت فعلاً */
        doLogout();
      }
      el('nv-name').textContent=CU?CU.name:'';
      var rr=el('nv-role'); if(rr&&CU) rr.textContent=t(ROLE_LABEL[CU.role]||'rSales');
      buildTabs(); render();
    }
  }).catch(function(){/* الشبكة فشلت — نبقى على الجلسة المحلية */});

  setInterval(function(){
    if(!CU) return;
    /* تحديث تلقائي فقط في صفحات العرض — لا نلمس صفحات الإدخال أبداً */
    if(['dash','alert','log'].indexOf(page)<0) return;
    loadAll().then(function(){render();}).catch(function(){});
  },45000);
})();
